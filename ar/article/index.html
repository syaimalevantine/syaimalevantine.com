<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>المقالات | Syaima Levantine</title>

  <meta
    name="description"
    content="مقالات Syaima Levantine حول الذكاء الاصطناعي وتصميم الأنماط والمايكروستوك والإنتاجية.">

  <meta
    name="author"
    content="Syaima Levantine">

  <style>
    html {
      direction: rtl;
    }

    body {
      margin: 0;
      background: #f8f6f0;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      direction: rtl;
      text-align: right;

      /* Arabic readability */
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1,
    h2,
    p {
      direction: rtl;
      text-align: right;
      word-break: normal;
      overflow-wrap: normal;
      hyphens: none;
    }

    h1 {
      margin-bottom: 20px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.25;
    }

    p {
      font-size: 1.1rem;
      line-height: 2;
    }

    .eyebrow {
      font-size: 0.85rem;
      opacity: 0.65;
      letter-spacing: 0.04em;
    }

    .empty-state {
      margin-top: 48px;
      padding: 28px;
      border: 1px solid #ddd8cc;
      border-radius: 18px;
      background: #fffdf8;
    }
  </style>
</head>

<body>

  <main>

    <p class="eyebrow">
      المقالات
    </p>

    <h1>
      رؤى وأدلة
    </h1>

    <p>
      اكتشف المقالات حول الذكاء الاصطناعي،
      وتصميم الأنماط، والمايكروستوك،
      والإنتاجية، وسير العمل الإبداعي.
    </p>

    <section class="empty-state">
      <p>
        لم يتم نشر أي مقالات باللغة العربية بعد.
      </p>
    </section>

  </main>

</body>

</html>
